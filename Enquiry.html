
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FlowTech Plumbing & Drains - Enquiry</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <nav>
            <a href="Index.html">Home</a>
            <a href="About.html">About</a>
            <a href="Services.html">Services</a>
            <a href="Enquiry.html">Enquiry</a>
            <a href="Contact.html">Contact</a>
        </nav>

        <main class="container">
            <h1>Customer Enquiry Form</h1>
            <form action="#" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                </div>

                <div class="form-group">
                    <label for="address">Physical House Address</label>
                    <input type="text" id="address" name="address" placeholder="Enter street address" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>
                </div>

                <h2>Upload Media Attachments</h2>
                <div class="form-group">
                    <label for="fileUpload">Design photos, color swatches, or reference images:</label>
                    <input type="file" id="fileUpload" name="fileUpload" multiple>
                </div>

                <button type="submit">Submit Enquiry</button>
            </form>
             <footer>
              <p>Open Daily: 8 AM-2 PM</p>
              <p>Contact: FlowTechPlumbing&Drains@gmail.com</p>
            </footer>
        </main>
    </body>
</html>
