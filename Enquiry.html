         <main class="container">
    <h1>Customer Enquiry Form</h1>
    <p>Tell us about your plumbing problem and we will get back to you as soon as possible.</p>

    <form action="https://formspree.io/f/mrppogbq" method="POST" enctype="multipart/form-data">

        <input type="hidden" name="_subject" value="New FlowTech Plumbing Enquiry">
        <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">

        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>
        </div>

        <div class="form-group">
            <label for="address">Physical House Address</label>
            <input type="text" id="address" name="address" placeholder="Enter street address" required>
        </div>

    
        <div class="form-group">
            <label for="service">Service Needed</label>
            <select id="service" name="service">
                <option value="Blocked drain">Blocked drain</option>
                <option value="Leaking pipe or tap">Leaking pipe or tap</option>
                <option value="Toilet or sink repair">Toilet or sink repair</option>
                <option value="Gas installation">Gas installation</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="message">Describe the Problem</label>
            <textarea id="message" name="message" rows="4" placeholder="Tell us what is happening"></textarea>
        </div>

        <!-- File upload: needs a paid Formspree plan. Delete this block on the free plan. -->
        <h2>Upload Photos</h2>
        <div class="form-group">
            <label for="fileUpload">Photos of the leak, blockage or fault (optional):</label>
            <input type="file" id="fileUpload" name="fileUpload" accept="image/*" multiple>
        </div>

        <button type="submit">Submit Enquiry</button>
    </form>

    <p id="formStatus" role="status"></p>

    <footer>
        <p>Open Daily: 8 AM-2 PM</p>
        <p>Contact: FlowTechPlumbing&Drains@gmail.com</p>
    </footer>
